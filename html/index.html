<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="game-container" style="display:none;">
        <div class="game-panel">
            <div class="header">
                <div class="title-box">
                    <i class="fas fa-network-wired"></i> MEMORY DUMP
                </div>
                <div class="timer-bar"><div id="timer-fill"></div></div>
            </div>
            
            <div class="grid-wrapper">
                <div id="memory-grid"></div>
            </div>
            
            <div class="footer">
                <div class="instruction"><i class="fas fa-search"></i> MATCH THE PAIRS</div>
                <div class="status" id="game-status">SCANNING DATA...</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
